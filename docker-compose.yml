services:
  besu:
    image: hyperledger/besu:26.5.0
    container_name: besu-private-tain
    restart: unless-stopped
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/var/lib/besu/key
      - --profile=ENTERPRISE
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,DEBUG,TXPOOL
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,QBFT
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
      - --logging=INFO
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:9545:9545"
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - ./data/besu:/var/lib/besu
